# Default container config. Mount your own over /etc/greprum/greprum.toml.
# Environment overrides: GREPRUM_LISTEN, GREPRUM_SPOOL_DIR,
# GREPRUM_GREPTIME_WRITE_URL, GREPRUM_GREPTIME_READ_URL.

[server]
listen = "0.0.0.0:8080"

[greptime]
write_url = "mysql://root@greptime:4002/public"

[spool]
dir = "/data/spool"

