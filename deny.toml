# cargo-deny: advisories, licences, bans, sources. Run: `make audit` / CI job `supply-chain`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa 0.9.10 via sqlx-mysql, no patched release; not reachable in our use (ADR 0051).
  { id = "RUSTSEC-2023-0071", reason = "rsa is only pulled in by sqlx-mysql; see docs/adr/0051" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
