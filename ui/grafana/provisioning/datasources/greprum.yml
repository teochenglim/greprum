apiVersion: 1
datasources:
  # GreptimeDB speaks the MySQL protocol; use a read-only user in production.
  - name: GrepRUM (GreptimeDB)
    uid: greprum-greptime
    type: mysql
    access: proxy
    url: greptime:4002
    user: root
    database: public
    isDefault: true
    jsonData:
      maxOpenConns: 5
  - name: GrepRUM metrics
    uid: greprum-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
