# Keep updates boring: one grouped PR per ecosystem per month, minor/patch only.
# Major versions need a code migration (sqlx 0.9, axum 0.8, jsonwebtoken 11, …): do them by hand,
# deliberately, with `make check` + `make test-db`, not as a surprise PR.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tracker
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
