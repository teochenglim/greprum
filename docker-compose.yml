# Local stack: GreptimeDB + GrepRUM + Prometheus + Grafana (dashboards provisioned).
#   cp greprum.example.toml greprum.toml        # set a site, an API key hash
#   docker compose up -d
#   docker compose run --rm greprum migrate --config /etc/greprum/greprum.toml
# Grafana: http://127.0.0.1:3000 (anonymous viewer; admin/admin to edit). Override host ports with
# GREPRUM_PORT, GREPTIME_HTTP_PORT, GREPTIME_MYSQL_PORT, GRAFANA_PORT, PROMETHEUS_PORT.
services:
  greptime:
    image: greptime/greptimedb:v1.2.1
    command: >
      standalone start --http-addr 0.0.0.0:4000 --rpc-bind-addr 0.0.0.0:4001
      --mysql-addr 0.0.0.0:4002 --postgres-addr 0.0.0.0:4003
    ports:
      - "127.0.0.1:${GREPTIME_HTTP_PORT:-4000}:4000"
      - "127.0.0.1:${GREPTIME_MYSQL_PORT:-4002}:4002"
    volumes: ["greptime-data:/greptimedb_data"]

  greprum:
    image: ${GREPRUM_IMAGE:-ghcr.io/teochenglim/greprum:latest}
    depends_on: [greptime]
    ports: ["127.0.0.1:${GREPRUM_PORT:-8080}:8080"]
    volumes:
      - greprum-data:/data
      - ./greprum.toml:/etc/greprum/greprum.toml:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on: [greprum]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./ui/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.6.1
    depends_on: [greptime, prometheus]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/greprum/greprum-overview.json
    volumes:
      - ./ui/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ui/grafana/dashboards:/var/lib/grafana/dashboards/greprum:ro
      - grafana-data:/var/lib/grafana

volumes:
  greptime-data:
  greprum-data:
  grafana-data:
